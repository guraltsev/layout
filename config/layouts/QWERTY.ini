; QWERTY Layout Definition
; This is the default keyboard layout with no remapping.
; Include this file to make QWERTY available in the layout menu.
;
; The [Remaps] section is empty since QWERTY is the default.

[Layout]
name=QWERTY
abbr=QW
icon=icons/default.ico

[Remaps]
; No remaps - default keyboard layout
