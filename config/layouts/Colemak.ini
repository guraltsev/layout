; Colemak Layout Definition
; This file defines the Colemak keyboard layout remapping.
;
; [Layout] section contains metadata:
;   name = Display name (used as registry key)
;   abbr = Abbreviation for tray menu
;   icon = Path to icon file (relative to script directory)
;
; [Remaps] section contains scancode -> output mappings:
;   Format: SCxxx=character
;   Use {Key} syntax for special keys (e.g., {Backspace}, {Enter})
;
; Scancode reference:
;   SC010-SC019 = Top row (Q-P on QWERTY)
;   SC01E-SC027 = Home row (A-; on QWERTY)
;   SC02C-SC032 = Bottom row (Z-M on QWERTY)
;   SC03A = Caps Lock
;   SC00E = Backspace

[Layout]
name=Colemak
abbr=Col
icon=icons/col.ico

[Remaps]
; Row 1 (QWERTY top row)
SC010=q
SC011=w
SC012=f
SC013=p
SC014=g
SC015=j
SC016=l
SC017=u
SC018=y
SC019=;

; Row 2 (Home row)
SC01E=a
SC01F=r
SC020=s
SC021=t
SC022=d
SC023=h
SC024=n
SC025=e
SC026=i
SC027=o

; Row 3 (Bottom row)
SC02C=z
SC02D=x
SC02E=c
SC02F=v
SC030=b
SC031=k
SC032=m

; Special keys
SC03A={Backspace}
SC00E={Backspace}
